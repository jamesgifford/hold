name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest

        # MariaDB is the package's real deployment target and the only engine
        # that can express the schema invariants in DatabaseSchemaTest. SQLite
        # stays in the matrix so the package keeps proving it is portable.
        services:
            mariadb:
                image: mariadb:12
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: hold_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                laravel: ['13.*']
                db: ['mariadb', 'sqlite']
                include:
                    - laravel: '13.*'
                      testbench: '11.*'

        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.db }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, pdo_mysql, bcmath, intl
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.composer/cache/files
                  key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --no-progress

            - name: Run tests
              run: vendor/bin/pest
              env:
                  DB_CONNECTION: ${{ matrix.db }}
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_SOCKET: ''
                  DB_DATABASE: hold_test
                  DB_USERNAME: root
                  DB_PASSWORD: root

    # The declared floors (illuminate ^13.0, testbench ^11.0, pest ^5.0) are
    # otherwise never resolved, so a floor could drift out of date unnoticed.
    lowest:
        runs-on: ubuntu-latest
        name: Lowest dependencies (PHP 8.4 / MariaDB)

        services:
            mariadb:
                image: mariadb:12
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: hold_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, pdo_mysql, bcmath, intl
                  coverage: none

            - name: Install lowest dependencies
              run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

            - name: Run tests
              run: vendor/bin/pest
              env:
                  DB_CONNECTION: mariadb
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_SOCKET: ''
                  DB_DATABASE: hold_test
                  DB_USERNAME: root
                  DB_PASSWORD: root
